# Supabase에 반영하기 — PC 없이.
#
# 지금까지 스키마와 Edge Function은 사람이 PC 앞에 앉아야만 올라갔고, 그래서
# 배포가 밀리면 게임이 멈췄다. 여기서 대신 하면 휴대폰에서 버튼 한 번으로,
# 혹은 코드를 밀어넣는 것만으로 반영된다.
name: Supabase

on:
  # 해당 파일이 main에 올라가면 알아서 반영한다. 사람이 기억해야 하는
  # 단계를 남겨두면 결국 잊는다.
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'lib/gacha.ts'
      - 'lib/players.ts'
      - 'lib/rosterData.ts'
      - 'lib/rosterOverrides.ts'
      - 'lib/rarity.ts'
      - 'lib/random.ts'
      # simulate-match가 lib/serverMatch.ts를 통해 번들하는 것들. 이 중
      # 하나라도 바뀌면 배포된 함수가 게임과 다른 판정을 하게 된다.
      - 'lib/serverMatch.ts'
      - 'lib/matchEngine.ts'
      - 'lib/squad.ts'
      - 'lib/match.ts'
      - 'lib/tactics.ts'
      - 'lib/tactics/**'
      - 'lib/formations.ts'
      - 'lib/condition.ts'
      - 'lib/traits.ts'
      - 'lib/league.ts'
      - 'lib/tuning.ts'
      # generate-placement-league가 lib/weeklyLeagueServer.ts를 통해 번들하는 것들.
      - 'lib/weeklyLeagueServer.ts'
      - 'lib/weeklyLeague/**'
      # pvp-opponent-squad가 그대로 번들하는 것.
      - 'lib/publicClub.ts'
  # 휴대폰에서 직접 돌릴 때. Actions 탭 → Supabase → Run workflow.
  workflow_dispatch:
    inputs:
      what:
        description: '무엇을 반영할까요'
        required: true
        default: 'both'
        type: choice
        options: [both, db, functions]

concurrency:
  # 두 번이 겹쳐 돌면 마이그레이션이 서로를 밟는다.
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 프로젝트 참조 읽기
        id: project
        # config.toml에 이미 적혀 있다. 참조는 공개 주소의 일부라 비밀이 아니다.
        run: |
          ref=$(grep -oP 'project_id\s*=\s*"\K[^"]+' supabase/config.toml)
          test -n "$ref" || { echo "config.toml에서 project_id를 찾지 못했습니다"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: 스키마 반영
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.what == 'db' ||
          github.event.inputs.what == 'both'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ steps.project.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: 함수 로직 번들 다시 만들기
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.what == 'functions' ||
          github.event.inputs.what == 'both'
        # 함수는 lib/에서 만든 번들을 쓴다. 저장소에 든 번들이 낡았을 수
        # 있으므로 배포 직전에 다시 만든다 — 로직이 두 벌이 되지 않도록.
        run: |
          npm ci
          npm run build:functions
          git --no-pager diff --stat -- supabase/functions/draw-pack/shared.js supabase/functions/simulate-match/shared.js supabase/functions/generate-placement-league/shared.js supabase/functions/pvp-opponent-squad/shared.js supabase/functions/simulate-pvp-match/shared.js || true

      - name: Edge Function 배포
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.what == 'functions' ||
          github.event.inputs.what == 'both'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy draw-pack --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy simulate-match --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy generate-placement-league --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy pvp-opponent-squad --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy simulate-pvp-match --project-ref "${{ steps.project.outputs.ref }}"

      - name: 요약
        if: always()
        run: |
          {
            echo "## Supabase 반영"
            echo ""
            echo "- 프로젝트: \`${{ steps.project.outputs.ref }}\`"
            echo "- 실행: ${{ github.event_name == 'push' && '코드 변경으로 자동' || format('수동 · {0}', github.event.inputs.what) }}"
            echo "- 커밋: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
